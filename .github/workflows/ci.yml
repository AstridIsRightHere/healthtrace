# CI（docs/28 CI/CD 工作流设计）：PR 与 main 推送时自动验证。
# - 后端：mvn verify。现有测试均为 @WebMvcTest / Mockito 单元测试，不连接数据库，CI 中无需 MySQL。
# - 前端：lint → vitest（jsdom）→ 类型检查 + 构建。
# 安全：本文件不包含任何密钥；将来需要密钥的步骤只能通过 ${{ secrets.XXX }} 注入。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试（JDK 25）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: mvn verify
        run: mvn -B -ntp verify

  frontend:
    name: 前端 lint / 测试 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
