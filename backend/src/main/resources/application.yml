# 公共配置（DEC-025 Spring Profiles）。环境差异放在 application-{profile}.yml。
# 数据库连接只从环境变量注入，不设默认值：缺失时启动失败，不静默回退（29-环境配置说明）。
spring:
  application:
    name: healthtrace
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # DEC-008：单文件 25 MiB；一次请求原件 + 预览图，合计上限 52 MB
      max-file-size: 25MB
      max-request-size: 52MB
  flyway:
    enabled: true
    locations: classpath:db/migration
    # ADR-009：已执行的迁移不原地修改，纠错追加新版本
    validate-on-migrate: true
    clean-disabled: true

logging:
  pattern:
    # TraceIdFilter 写入 MDC 的请求关联号；Boot 默认控制台/文件格式会插入 correlation 段（非请求线程为空）
    correlation: "[%X{traceId:-}] "

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  servlet:
    session:
      # DEC-017：不活跃 30 分钟失效；绝对 8 小时上限由 SessionAbsoluteTimeoutFilter 负责
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax

# 邮箱加密与索引密钥（Base64，32 字节，二者不同），只从环境变量注入；缺失或格式错误时启动失败
healthtrace:
  security:
    email-encryption-key: ${HT_EMAIL_ENCRYPTION_KEY}
    email-index-key: ${HT_EMAIL_INDEX_KEY}
  # 原图存储：local 仅用于开发/测试；根目录只从环境变量注入，缺失时启动失败
  storage:
    type: ${HT_STORAGE_TYPE:local}
    local:
      root: ${HT_STORAGE_LOCAL_ROOT}
  # OCR（ADR-004）：原文加密密钥与百度凭据只从环境变量注入，任一缺失时启动失败；日志不得输出凭据
  ocr:
    encryption-key: ${HT_OCR_ENCRYPTION_KEY}
    baidu:
      api-key: ${HT_BAIDU_OCR_API_KEY}
      secret-key: ${HT_BAIDU_OCR_SECRET_KEY}
