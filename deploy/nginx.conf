# HealthTrace 生产 Nginx：终止 HTTPS、提供前端静态文件、把 /api 反向代理到后端容器。
# 证书放在宿主机 deploy/certs/（fullchain.pem、privkey.pem），以只读卷挂载到 /etc/nginx/certs。

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # 访问日志不记录查询串（邮件验证/重置链接里的 token 不落日志）
    log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # 与后端 multipart 上限一致（DEC-008：单文件 25 MiB，一次请求合计 52 MB）
    client_max_body_size 52m;

    # 登录、注册、找回密码按客户端 IP 限流（后端仍有自身的失败次数锁定）
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Docker 内置 DNS；backend 容器重建后 IP 会变，用 resolve 动态重新解析（nginx ≥ 1.27.3），否则会一直 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream healthtrace_backend {
        zone healthtrace_backend 64k;
        server backend:8080 resolve;
        keepalive 16;
    }

    # 健康检查与 HTTP→HTTPS 跳转
    server {
        listen 80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;

        # 安全响应头（ADR-007）：CSP 只允许同源资源；照片/PDF 预览使用 blob: 地址
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # 接口文档与 Spring 内部端点不对外开放（prod 本就关闭 springdoc，这里再挡一层）
        location ~ ^/(swagger-ui|v3/api-docs|actuator)(/|$) {
            return 404;
        }

        location ~ ^/api/v1/(sessions|accounts|password-reset-requests|password-resets)$ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;
            include /etc/nginx/healthtrace-proxy.conf;
        }

        location /api/ {
            include /etc/nginx/healthtrace-proxy.conf;
        }

        # Service Worker 与入口页必须每次校验，否则新版本无法生效
        location = /sw.js {
            add_header Cache-Control "no-cache" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        # Vite 产物带内容哈希，可长期缓存
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # 单页应用：未知路径回落到 index.html（不缓存）
        location / {
            add_header Cache-Control "no-cache" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
