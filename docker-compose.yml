# 本地开发用 MySQL 8.4 LTS（DEC-012）。仅用于合成数据，不连接测试/生产库（29-环境配置说明）。
# 账号密码从根目录 .env 读取（参考 .env.example），.env 不进入 Git。
services:
  mysql:
    image: mysql:8.4
    container_name: healthtrace-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请在 .env 中设置 MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?请在 .env 中设置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 只绑定本机回环地址，不对局域网暴露
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - healthtrace-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  healthtrace-mysql-data:
